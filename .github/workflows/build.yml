name: Verify desktop project

on:
  push:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
      
      - name: Scan dependencies for vulnerabilities
        run: npm audit --audit-level=high

      - run: npm run verify

      - run: npm run make

      - uses: actions/upload-artifact@v4
        with:
          name: InstaStart-Windows
          path: out/make/**